site_name: System Design Prep
site_description: >-
  FAANG Staff/Principal/EM system-design interview prep — a 20-step framework, reusable
  patterns, per-system deep dives, trade-offs, and staged "stops" from simple to web-scale.
site_url: https://arungudelli.github.io/system-design-prep/
site_author: arungudelli

repo_url: https://github.com/arungudelli/system-design-prep
repo_name: arungudelli/system-design-prep
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/compass-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# File-existence links are enforced by --strict; cross-page anchor slugs vary between
# Docsify and MkDocs, so we don't fail the build on them.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: ignore

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arungudelli/system-design-prep

