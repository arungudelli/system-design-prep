<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>System Design Prep — Staff/Principal Interview Notes</title>
  <meta name="description" content="Personal, incrementally-built system design interview preparation — framework, patterns, per-system deep dives, trade-offs, and drills for FAANG Staff/Principal/EM interviews." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>" />
  <!-- Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #3b82f6;
      --sidebar-width: 320px;
    }
    .app-name-link img { width: 0; }
    .markdown-section { max-width: 900px; }
    .markdown-section pre, .markdown-section code { font-size: 0.85em; }
    /* Keep ASCII architecture diagrams monospaced and un-wrapped */
    .markdown-section pre[data-lang="text"] > code,
    .markdown-section pre[data-lang="txt"] > code {
      white-space: pre;
    }
    .sidebar-nav > ul > li > strong,
    .sidebar-nav > ul > li > p { color: #62676b; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .cover-main blockquote p { font-size: 1.1rem; }
    /* Dark mode via prefers-color-scheme */
    @media (prefers-color-scheme: dark) {
      body, .markdown-section { background: #0d1117; color: #c9d1d9; }
      .sidebar { background: #010409; }
      .sidebar-nav a { color: #c9d1d9; }
      .markdown-section pre { background: #161b22; }
      .markdown-section code { background: rgba(110,118,129,0.2); color: #e6edf3; }
      .markdown-section pre > code { color: #e6edf3; }
      .markdown-section tr { background: #0d1117; border-top: 1px solid #30363d; }
      .markdown-section tr:nth-child(2n) { background: #161b22; }
      .markdown-section th, .markdown-section td { border: 1px solid #30363d; }
      .app-name-link { color: #c9d1d9 !important; }
      .search input { background: #161b22; color: #c9d1d9; }
    }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: '🧭 System Design Prep',
      repo: 'https://github.com/arungudelli/system-design-prep',
      loadSidebar: true,
      loadNavbar: false,
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 3,
      relativePath: false,
      notFoundPage: true,
      search: {
        placeholder: 'Search notes…',
        noData: 'No results.',
        depth: 4,
        maxAge: 86400000
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied'
      }
    };
  </script>
  <!-- Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <!-- Syntax highlighting for common languages -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>
</html>
